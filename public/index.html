<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&#x8D44;&#x4EA7;&#x914D;&#x7F6E;&#x770B;&#x677F;</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --bg: #f5f7fb;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --border: #d0d7de;
            --accent: #0f766e;
            --accent-soft: #ecfeff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .dashboard-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 30px;
            width: 100%;
            max-width: 1480px;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .total-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .total-amount {
            font-size: 2rem;
            font-weight: bold;
            color: var(--text-main);
            margin: 10px 0 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .icon-button {
            border: 1px solid var(--border);
            background: #fff;
            color: #4b5563;
            border-radius: 999px;
            width: 36px;
            height: 36px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .icon-button:hover {
            background: #f3f4f6;
            border-color: #9ca3af;
        }

        .icon-button:active {
            transform: translateY(1px);
        }

        .icon-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .icon-button.copied,
        .icon-button.is-active {
            color: var(--accent);
            border-color: #5eead4;
            background: var(--accent-soft);
        }

        .icon-button svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(320px, 0.72fr);
            gap: 24px;
        }

        .chart-panel {
            border: 1px solid #eef2f7;
            border-radius: 14px;
            padding: 20px;
            background: linear-gradient(180deg, #ffffff 0%, #fafcff 100%);
        }

        .chart-title {
            margin: 0 0 16px;
            font-size: 1rem;
            color: var(--text-main);
            text-align: center;
        }

        .chart-container {
            position: relative;
            margin: 0 auto;
            height: 320px;
            width: min(100%, 360px);
        }

        .chart-table {
            margin-top: 18px;
            overflow-x: auto;
        }

        .qdii-list {
            overflow-x: auto;
            width: 100%;
        }

        .qdii-panel {
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            border: 1px solid #eef2f7;
            background: linear-gradient(135deg, #ffffff 0%, #fafcff 100%);
            width: 100%;
        }

        .qdii-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--accent) 0%, #2dd4bf 100%);
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .qdii-panel:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(15, 118, 110, 0.1);
            border-color: rgba(15, 118, 110, 0.2);
            background: linear-gradient(135deg, #ffffff 0%, #f0fdfa 100%);
        }

        .qdii-panel:hover::before {
            opacity: 1;
        }

        .qdii-content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px;
            text-align: center;
        }

        .qdii-icon-container {
            margin-bottom: 10px;
            color: var(--accent);
            background: var(--accent-soft);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .qdii-panel:hover .qdii-icon-container {
            transform: scale(1.1);
        }

        .qdii-title {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.88rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .qdii-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: -0.02em;
            margin: 8px 0 4px;
            background: linear-gradient(135deg, var(--accent) 0%, #0d9488 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .qdii-hint {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 4px;
            background: #f1f5f9;
            padding: 4px 10px;
            border-radius: 999px;
            transition: all 0.3s ease;
        }

        .qdii-panel:hover .qdii-hint {
            background: var(--accent-soft);
            color: var(--accent);
        }

        .stat-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
            color: var(--text-main);
        }

        .stat-table th,
        .stat-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #eef2f7;
            text-align: left;
            white-space: nowrap;
        }

        .stat-table th {
            color: var(--text-muted);
            font-weight: 600;
            background: #f8fafc;
        }

        .stat-table tbody tr:hover {
            background: #f8fbff;
        }

        .stat-table .is-number {
            text-align: right;
        }

        .amount-hidden {
            color: var(--text-muted);
            letter-spacing: 0.08em;
        }

        .third-column-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 100%;
        }

        .risk-panel {
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            border: 1px solid #eef2f7;
            background: linear-gradient(135deg, #ffffff 0%, #fafcff 100%);
            width: 100%;
        }

        .risk-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #f43f5e 0%, #ec4899 100%);
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .risk-panel:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(244, 63, 94, 0.1);
            border-color: rgba(244, 63, 94, 0.2);
            background: linear-gradient(135deg, #ffffff 0%, #fff1f2 100%);
        }

        .risk-panel:hover::before {
            opacity: 1;
        }

        .risk-content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px;
            text-align: center;
        }

        .risk-icon-container {
            margin-bottom: 10px;
            color: #f43f5e;
            background: #ffe4e6;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .risk-panel:hover .risk-icon-container {
            transform: scale(1.1);
        }

        .risk-title {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.88rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .risk-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: #f43f5e;
            letter-spacing: -0.02em;
            margin: 8px 0 4px;
            background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .risk-hint {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 4px;
            background: #f1f5f9;
            padding: 4px 10px;
            border-radius: 999px;
            transition: all 0.3s ease;
        }

        .risk-panel:hover .risk-hint {
            background: #ffe4e6;
            color: #f43f5e;
        }

        .ai-panel {
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            border: 1px solid #eef2f7;
            background: linear-gradient(135deg, #ffffff 0%, #fafcff 100%);
            width: 100%;
        }

        .ai-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #6366f1 0%, #8b5cf6 100%);
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .ai-panel:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(99, 102, 241, 0.1);
            border-color: rgba(99, 102, 241, 0.2);
            background: linear-gradient(135deg, #ffffff 0%, #eef2ff 100%);
        }

        .ai-panel:hover::before {
            opacity: 1;
        }

        .ai-content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px;
            text-align: center;
        }

        .ai-icon-container {
            margin-bottom: 10px;
            color: #6366f1;
            background: #e0e7ff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .ai-panel:hover .ai-icon-container {
            transform: scale(1.1);
        }

        .ai-title {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.88rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .ai-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: #6366f1;
            letter-spacing: -0.02em;
            margin: 8px 0 4px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .ai-hint {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 4px;
            background: #f1f5f9;
            padding: 4px 10px;
            border-radius: 999px;
            transition: all 0.3s ease;
        }

        .ai-panel:hover .ai-hint {
            background: #e0e7ff;
            color: #6366f1;
        }

        @media (max-width: 1200px) {
            .charts-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .third-column-container {
                grid-column: 1 / -1;
                flex-direction: row;
            }

            .qdii-panel, .risk-panel, .ai-panel {
                flex: 1;
                align-self: stretch;
            }
        }

        @media (max-width: 768px) {
            .dashboard-card {
                padding: 24px 18px;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }

            .chart-container {
                height: 280px;
            }

            .third-column-container {
                flex-direction: column;
            }
        }

        /* Modal Overlay with Glassmorphism */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* Modal Card Container */
        .modal-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            width: 90%;
            max-width: 680px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            transform: scale(0.95) translateY(10px);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
        }

        .modal-overlay.show .modal-card {
            transform: scale(1) translateY(0);
        }

        /* Modal Header */
        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid #eef2f7;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(180deg, #ffffff 0%, #fafcff 100%);
        }

        .modal-title {
            margin: 0;
            font-size: 1.2rem;
            color: var(--text-main);
            font-weight: 700;
        }

        /* Close Button */
        .close-button {
            border: none;
            background: none;
            color: var(--text-muted);
            font-size: 2rem;
            line-height: 1;
            cursor: pointer;
            padding: 0 4px;
            transition: color 0.2s ease, transform 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }

        .close-button:hover {
            color: var(--text-main);
            background-color: #f3f4f6;
        }

        .close-button:active {
            transform: scale(0.9);
        }

        /* Modal Body */
        .modal-body {
            padding: 24px;
            overflow-y: auto;
            background-color: #ffffff;
        }

        .modal-table-container {
            overflow-x: auto;
            border: 1px solid #eef2f7;
            border-radius: 8px;
        }

        .modal-body .stat-table th {
            position: sticky;
            top: 0;
            z-index: 1;
            background: #f8fafc;
        }

        .modal-body .stat-table td {
            font-size: 0.95rem;
        }

        .modal-body .stat-table tbody tr:last-child td {
            border-bottom: none;
        }

        /* Action Button inside Modal Header */
        .action-btn {
            border: 1px solid var(--accent);
            background: var(--accent-soft);
            color: var(--accent);
            border-radius: 6px;
            padding: 6px 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: var(--accent);
            color: #fff;
        }

        .action-btn:active {
            transform: translateY(1px);
        }

        .action-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .action-btn svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .animate-spin {
            animation: spin 1s linear infinite;
        }

        /* Modal Table Total Row */
        .total-row td {
            font-weight: 700 !important;
            background: #f8fafc !important;
            border-top: 2px solid #eef2f7 !important;
        }
    </style>
</head>
<body>
<div class="dashboard-card">
    <div class="header">
        <div class="total-label">&#x603B;&#x8D44;&#x4EA7; (CNY &#x8BA1;&#x4EF7;)</div>
        <div class="total-amount">
            <span id="totalAmount">CNY 0.00</span>
            <button type="button" class="icon-button" id="copyTotalAmount" aria-label="复制金额" title="复制金额" disabled></button>
            <button type="button" class="icon-button" id="toggleTableAmounts" aria-label="显示金额" title="显示金额"></button>
            <button type="button" class="icon-button" id="savePagePng" aria-label="保存页面为图片" title="保存页面为图片" disabled></button>
        </div>
    </div>

    <div class="charts-grid">
        <section class="chart-panel">
            <h2 class="chart-title">&#x6309;&#x89D2;&#x8272;&#x5206;&#x5E03;</h2>
            <div class="chart-container">
                <canvas id="rolePieChart"></canvas>
            </div>
            <div class="chart-table" id="roleStatsTable"></div>
        </section>

        <section class="chart-panel">
            <h2 class="chart-title">&#x6309;&#x5E01;&#x79CD;&#x5206;&#x5E03;</h2>
            <div class="chart-container">
                <canvas id="symbolPieChart"></canvas>
            </div>
            <div class="chart-table" id="symbolStatsTable"></div>
        </section>

        <div class="third-column-container">
            <section class="chart-panel qdii-panel" id="qdiiPanel">
                <div class="qdii-list" id="qdiiList"></div>
            </section>
            <section class="chart-panel risk-panel" id="riskPanel">
                <!-- Filled dynamically by JS -->
            </section>
            <section class="chart-panel ai-panel" id="aiPanel">
                <!-- Filled dynamically by JS -->
            </section>
        </div>
    </div>
</div>

<!-- Modal for Role Holdings Detail -->
<div id="roleDetailsModal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="modalTitle" class="modal-title">角色的持仓明细</h3>
            <button type="button" id="closeModalBtn" class="close-button" aria-label="关闭" title="关闭">&times;</button>
        </div>
        <div class="modal-body">
            <div class="modal-table-container">
                <table class="stat-table">
                    <thead>
                        <tr>
                            <th>资产名称</th>
                            <th>币种</th>
                            <th class="is-number">持仓数量</th>
                            <th class="is-number">组合占比</th>
                        </tr>
                    </thead>
                    <tbody id="modalTableBody">
                        <!-- Filled by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal for QDII Quota Detail -->
<div id="qdiiDetailsModal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header">
            <h3 class="modal-title">QDII &#x989d;&#x5ea6;&#x660e;&#x7ec6;</h3>
            <div style="display: flex; align-items: center; gap: 8px;">
                <button type="button" id="generateQdiiImageBtn" class="action-btn" title="&#x5c06;&#x660e;&#x7ec6;&#x5217;&#x8868;&#x751f;&#x6210;&#x5e76;&#x4e0b;&#x8f7d;&#x4e3a; PNG &#x56fe;&#x7247;">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                    &#x751f;&#x6210;&#x56fe;&#x7247;
                </button>
                <button type="button" id="closeQdiiModalBtn" class="close-button" aria-label="关闭" title="关闭">&times;</button>
            </div>
        </div>
        <div class="modal-body">
            <div class="modal-table-container">
                <table class="stat-table">
                    <thead>
                        <tr>
                            <th>名称</th>
                            <th class="is-number">额度</th>
                        </tr>
                    </thead>
                    <tbody id="qdiiModalTableBody">
                        <!-- Filled by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal for Risk Holdings Detail -->
<div id="riskDetailsModal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="riskModalTitle" class="modal-title">风险资产明细</h3>
            <button type="button" id="closeRiskModalBtn" class="close-button" aria-label="关闭" title="关闭">&times;</button>
        </div>
        <div class="modal-body">
            <div class="modal-table-container">
                <table class="stat-table">
                    <thead>
                        <tr>
                            <th>资产名称</th>
                            <th class="is-number">数额</th>
                            <th>币种</th>
                            <th class="is-number">占总组合比例</th>
                        </tr>
                    </thead>
                    <tbody id="riskModalTableBody">
                        <!-- Filled by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal for AI Holdings Detail -->
<div id="aiDetailsModal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="aiModalTitle" class="modal-title">All in AI 资产明细</h3>
            <button type="button" id="closeAiModalBtn" class="close-button" aria-label="关闭" title="关闭">&times;</button>
        </div>
        <div class="modal-body">
            <div class="modal-table-container">
                <table class="stat-table">
                    <thead>
                        <tr>
                            <th>资产名称</th>
                            <th class="is-number">数额</th>
                            <th>币种</th>
                            <th class="is-number">占总组合比例</th>
                        </tr>
                    </thead>
                    <tbody id="aiModalTableBody">
                        <!-- Filled by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>

        if (amountsVisible) {
            return formatted;
        }

        return `<span class="amount-hidden" data-real-value="${formatted}" aria-label="\u91d1\u989d\u5df2\u9690\u85cf">\u2022\u2022\u2022\u2022\u2022\u2022</span>`;
    }

    function renderTotalAmount() {
        totalAmountElement.innerHTML = renderAmount(totalAmountRawValue);
    }

    function renderStatTable(tableId, stats, firstColumnLabel) {
        const container = document.getElementById(tableId);
        const total = stats.reduce((sum, item) => sum + Number(item.value || 0), 0);

        if (!container) {
            return;
        }

        if (!stats.length) {
            container.innerHTML = `
                <table class="stat-table">
                    <thead>
                        <tr>
                            <th>${firstColumnLabel}</th>
                            <th class="is-number">\u6570\u989d (CNY)</th>
                            <th class="is-number">\u5360\u6bd4</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="3">\u6682\u65e0\u6570\u636e</td>
                        </tr>
                    </tbody>
                </table>
            `;
            return;
        }

        container.innerHTML = `
            <table class="stat-table">
                <thead>
                    <tr>
                        <th>${firstColumnLabel}</th>
                        <th class="is-number">\u6570\u989d (CNY)</th>
                        <th class="is-number">\u5360\u6bd4</th>
                    </tr>
                </thead>
                <tbody>
                    ${stats.map((item) => {
                        const value = Number(item.value || 0);
                        const percentage = total > 0 ? ((value / total) * 100).toFixed(2) : "0.00";
                        const percentageDisplay = amountsVisible
                            ? `${percentage}%`
                            : `<span class="amount-hidden" data-real-value="${percentage}%" aria-label="比例已隐藏">••••••</span>`;
                        return `
                            <tr>
                                <td>${item.label}</td>
                                <td class="is-number">${renderAmount(value)}</td>
                                <td class="is-number">${percentageDisplay}</td>
                            </tr>
                        `;
                    }).join("")}
                </tbody>
            </table>
        `;
    }

                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>

    function renderPieChart(canvasId, stats) {
        const labels = stats.map((item) => item.label);
        const values = stats.map((item) => item.value);
        const ctx = document.getElementById(canvasId).getContext("2d");

        new Chart(ctx, {
            type: "pie",
            data: {
                labels,
                datasets: [{
                    data: values,
                    backgroundColor: labels.map((_, index) => chartPalette[index % chartPalette.length]),
                    borderWidth: 2,
                    borderColor: "#ffffff"
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                onClick: (event, activeElements) => {
                    if (activeElements && activeElements.length > 0) {
                        const index = activeElements[0].index;
                        const value = labels[index];
                        if (canvasId === "rolePieChart") {
                            openDetailsModal("role", value);
                        } else if (canvasId === "symbolPieChart") {
                            openDetailsModal("symbol", value);
                        }
                    }
                },
                onHover: (event, activeElements) => {
                    if (canvasId === "rolePieChart" || canvasId === "symbolPieChart") {
                        const target = event.native ? event.native.target : (event.target || ctx.canvas);
                        if (target) {
                            target.style.cursor = (activeElements && activeElements.length > 0) ? "pointer" : "default";
                        }
                    }
                },
                plugins: {
                    legend: {
                        position: "bottom",
                        labels: {
                            padding: 18
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label(context) {
                                const label = context.label || "";
                                if (!amountsVisible) {
                                    return `${label}: •••••• (••••••)`;
                                }
                                const value = context.parsed || 0;
                                const total = context.dataset.data.reduce((sum, current) => sum + current, 0);
                                const percentage = total > 0 ? ((value / total) * 100).toFixed(2) : "0.00";
                                return `${label}: ${formatCny(value)} (${percentage}%)`;
                            }
                        }
                    }
                }
            }
        });
    }

    async function fetchAndRenderChart() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();

            totalAmountRawValue = Number(data.total_cny).toFixed(2);
            totalRiskAmountRawValue = Number(data.total_risk_cny || 0).toFixed(2);
            totalAiAmountRawValue = Number(data.total_ai_cny || 0).toFixed(2);
            latestRoleStats = data.stats_by_role || [];
            latestSymbolStats = data.stats_by_symbol || [];
            latestQdiiRows = data.qdii || [];
            latestAssets = data.assets || [];
            renderTotalAmount();
            copyButton.disabled = false;

            renderPieChart("rolePieChart", latestRoleStats);
            renderPieChart("symbolPieChart", latestSymbolStats);
            renderStatTable("roleStatsTable", latestRoleStats, "\u89d2\u8272\u540d");
            renderStatTable("symbolStatsTable", latestSymbolStats, "\u5e01\u79cd");
            renderQdiiList(latestQdiiRows);
            renderRiskPanel(totalRiskAmountRawValue, totalAmountRawValue);
            renderAiPanel(totalAiAmountRawValue, totalAmountRawValue);
            savePagePngButton.disabled = false;
        } catch (error) {
            console.error("Failed to load dashboard data", error);
            totalAmountElement.innerText = "\u6570\u636e\u52a0\u8f7d\u5931\u8d25";
            copyButton.disabled = true;
            savePagePngButton.disabled = true;
        }
    }

    function toggleTableAmounts() {
        amountsVisible = !amountsVisible;
        setToggleTableAmountsState();
        renderTotalAmount();
        renderStatTable("roleStatsTable", latestRoleStats, "\u89d2\u8272\u540d");
        renderStatTable("symbolStatsTable", latestSymbolStats, "\u5e01\u79cd");
        renderRiskPanel(totalRiskAmountRawValue, totalAmountRawValue);
        renderAiPanel(totalAiAmountRawValue, totalAmountRawValue);
        if (activeFilterType && activeFilterValue) {
            renderDetailsTable();
        }
        if (riskDetailsModal.classList.contains("show")) {
            renderRiskModalTable();
        }
        if (aiDetailsModal.classList.contains("show")) {
            renderAiModalTable();
        }
    }

    function setSaveButtonState(generating) {
        savePagePngButton.innerHTML = generating ? icons.spinner : icons.image;
        const label = generating ? "\u6b63\u5728\u751f\u6210\u56fe\u7247..." : "\u4fdd\u5b58\u9875\u9762\u4e3a\u56fe\u7247";
        savePagePngButton.setAttribute("aria-label", label);
        savePagePngButton.setAttribute("title", label);
    }

    async function savePagePng() {
        const dashboardCard = document.querySelector(".dashboard-card");
        if (!dashboardCard) return;

        setSaveButtonState(true);
        savePagePngButton.disabled = true;

        try {
            // Wait briefly to ensure UI states settle
            await new Promise(resolve => setTimeout(resolve, 150));

            const canvas = await html2canvas(dashboardCard, {
                useCORS: true,
                scale: 2, // High resolution
                backgroundColor: null,
                onclone: (clonedDoc) => {
                    // 1. Reveal all hidden values in the cloned DOM
                    const hiddenElements = clonedDoc.querySelectorAll(".amount-hidden");
                    hiddenElements.forEach((el) => {
                        const realValue = el.getAttribute("data-real-value");
                        if (realValue) {
                            el.textContent = realValue;
                        }
                    });

                    // 2. Hide interactive buttons in the header so they don't appear in the PNG
                    const buttonsToHide = ["copyTotalAmount", "toggleTableAmounts", "savePagePng"];
                    buttonsToHide.forEach((id) => {
                        const btn = clonedDoc.getElementById(id);
                        if (btn) {
                            btn.style.display = "none";
                        }
                    });

                    // 3. Remove background gradient and text clipping for html2canvas compatibility
                    const gradientValues = clonedDoc.querySelectorAll(".risk-value, .ai-value, .qdii-value");
                    gradientValues.forEach((el) => {
                        el.style.background = "none";
                        el.style.webkitTextFillColor = "initial";
                        if (el.classList.contains("risk-value")) {
                            el.style.color = "#f43f5e";
                        } else if (el.classList.contains("ai-value")) {
                            el.style.color = "#6366f1";
                        } else if (el.classList.contains("qdii-value")) {
                            el.style.color = "#0f766e";
                        }
                    });
                }
            });

            const imageUri = canvas.toDataURL("image/png");
            const link = document.createElement("a");
            link.href = imageUri;
            link.download = `\u8d44\u4ea7\u914d\u7f6e\u770b\u677f_${new Date().toISOString().slice(0, 10)}.png`;
            link.click();
        } catch (error) {
            console.error("保存图片失败", error);
            alert("\u4fdd\u5b58\u56fe\u7247\u5931\u8d25\uff0c\u8bf7\u91cd\u8bd5\uff01");
        } finally {
            savePagePngButton.disabled = false;
            setSaveButtonState(false);
        }
    }

    setCopyButtonState("\u590d\u5236\u91d1\u989d", false);
    setToggleTableAmountsState();
    setSaveButtonState(false);
    renderTotalAmount();
    copyButton.addEventListener("click", copyTotalAmount);
    toggleTableAmountsButton.addEventListener("click", toggleTableAmounts);
    savePagePngButton.addEventListener("click", savePagePng);
    window.addEventListener("load", fetchAndRenderChart);
</script>
