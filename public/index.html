<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&#x8D44;&#x4EA7;&#x914D;&#x7F6E;&#x770B;&#x677F;</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f5f7fb;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --border: #d0d7de;
            --accent: #0f766e;
            --accent-soft: #ecfeff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .dashboard-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 30px;
            width: 100%;
            max-width: 960px;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .total-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .total-amount {
            font-size: 2rem;
            font-weight: bold;
            color: var(--text-main);
            margin: 10px 0 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .icon-button {
            border: 1px solid var(--border);
            background: #fff;
            color: #4b5563;
            border-radius: 999px;
            width: 36px;
            height: 36px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .icon-button:hover {
            background: #f3f4f6;
            border-color: #9ca3af;
        }

        .icon-button:active {
            transform: translateY(1px);
        }

        .icon-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .icon-button.copied,
        .icon-button.is-active {
            color: var(--accent);
            border-color: #5eead4;
            background: var(--accent-soft);
        }

        .icon-button svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 24px;
        }

        .chart-panel {
            border: 1px solid #eef2f7;
            border-radius: 14px;
            padding: 20px;
            background: linear-gradient(180deg, #ffffff 0%, #fafcff 100%);
        }

        .chart-title {
            margin: 0 0 16px;
            font-size: 1rem;
            color: var(--text-main);
            text-align: center;
        }

        .chart-container {
            position: relative;
            margin: 0 auto;
            height: 320px;
            width: min(100%, 360px);
        }

        .chart-table {
            margin-top: 18px;
            overflow-x: auto;
        }

        .stat-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
            color: var(--text-main);
        }

        .stat-table th,
        .stat-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #eef2f7;
            text-align: left;
            white-space: nowrap;
        }

        .stat-table th {
            color: var(--text-muted);
            font-weight: 600;
            background: #f8fafc;
        }

        .stat-table tbody tr:hover {
            background: #f8fbff;
        }

        .stat-table td.is-number {
            text-align: right;
        }

        .amount-hidden {
            color: var(--text-muted);
            letter-spacing: 0.08em;
        }

        @media (max-width: 768px) {
            .dashboard-card {
                padding: 24px 18px;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }

            .chart-container {
                height: 280px;
            }
        }
    </style>
</head>
<body>
<div class="dashboard-card">
    <div class="header">
        <div class="total-label">&#x603B;&#x8D44;&#x4EA7; (CNY &#x8BA1;&#x4EF7;)</div>
        <div class="total-amount">
            <span id="totalAmount">CNY 0.00</span>
            <button type="button" class="icon-button" id="copyTotalAmount" aria-label="复制金额" title="复制金额" disabled></button>
            <button type="button" class="icon-button" id="toggleTableAmounts" aria-label="显示表格金额" title="显示表格金额"></button>
        </div>
    </div>

    <div class="charts-grid">
        <section class="chart-panel">
            <h2 class="chart-title">&#x6309;&#x89D2;&#x8272;&#x5206;&#x5E03;</h2>
            <div class="chart-container">
                <canvas id="rolePieChart"></canvas>
            </div>
            <div class="chart-table" id="roleStatsTable"></div>
        </section>

        <section class="chart-panel">
            <h2 class="chart-title">&#x6309;&#x5E01;&#x79CD;&#x5206;&#x5E03;</h2>
            <div class="chart-container">
                <canvas id="symbolPieChart"></canvas>
            </div>
            <div class="chart-table" id="symbolStatsTable"></div>
        </section>
    </div>
</div>

<script>
    const API_URL = "/api/assets-stats";
    const totalAmountElement = document.getElementById("totalAmount");
    const copyButton = document.getElementById("copyTotalAmount");
    const toggleTableAmountsButton = document.getElementById("toggleTableAmounts");
    const icons = {
        copy: `
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="9" y="9" width="11" height="11" rx="2" stroke-width="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke-width="2" stroke-linecap="round"></path>
            </svg>
        `,
        check: `
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M20 6 9 17l-5-5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
        `,
        eye: `
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" stroke-width="2" stroke-linejoin="round"></path>
                <circle cx="12" cy="12" r="3" stroke-width="2"></circle>
            </svg>
        `,
        eyeOff: `
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m3 3 18 18" stroke-width="2" stroke-linecap="round"></path>
                <path d="M10.6 10.6a3 3 0 0 0 3.8 3.8" stroke-width="2" stroke-linecap="round"></path>
                <path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a16 16 0 0 1-3.1 4.1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M6.6 6.6C3.6 8.6 2 12 2 12s3.5 7 10 7a10.7 10.7 0 0 0 4.4-.9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
        `
    };
    const chartPalette = [
        "#3498db",
        "#2ecc71",
        "#e67e22",
        "#9b59b6",
        "#e74c3c",
        "#16a085",
        "#f1c40f",
        "#34495e",
        "#ff7f50",
        "#8e44ad"
    ];

    let totalAmountRawValue = "0.00";
    let tableAmountsVisible = false;
    let latestRoleStats = [];
    let latestSymbolStats = [];

    function setCopyButtonState(label, copied) {
        copyButton.innerHTML = copied ? icons.check : icons.copy;
        copyButton.setAttribute("aria-label", label);
        copyButton.setAttribute("title", label);
        copyButton.classList.toggle("copied", Boolean(copied));
    }

    function setToggleTableAmountsState() {
        const label = tableAmountsVisible ? "\u9690\u85cf\u8868\u683c\u91d1\u989d" : "\u663e\u793a\u8868\u683c\u91d1\u989d";
        toggleTableAmountsButton.innerHTML = tableAmountsVisible ? icons.eye : icons.eyeOff;
        toggleTableAmountsButton.setAttribute("aria-label", label);
        toggleTableAmountsButton.setAttribute("title", label);
        toggleTableAmountsButton.classList.toggle("is-active", tableAmountsVisible);
    }

    function formatCny(value) {
        return "CNY " + Number(value).toLocaleString("zh-CN", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }

    async function copyTotalAmount() {
        try {
            await navigator.clipboard.writeText(totalAmountRawValue);
            setCopyButtonState("\u5df2\u590d\u5236", true);
        } catch (error) {
            console.error("Failed to copy total assets", error);
            setCopyButtonState("\u590d\u5236\u5931\u8d25", false);
        }

        window.setTimeout(() => setCopyButtonState("\u590d\u5236\u91d1\u989d", false), 1500);
    }

    function renderAmount(value) {
        if (tableAmountsVisible) {
            return formatCny(value);
        }

        return `<span class="amount-hidden" aria-label="\u91d1\u989d\u5df2\u9690\u85cf">\u2022\u2022\u2022\u2022\u2022\u2022</span>`;
    }

    function renderStatTable(tableId, stats, firstColumnLabel) {
        const container = document.getElementById(tableId);
        const total = stats.reduce((sum, item) => sum + Number(item.value || 0), 0);

        if (!container) {
            return;
        }

        if (!stats.length) {
            container.innerHTML = `
                <table class="stat-table">
                    <thead>
                        <tr>
                            <th>${firstColumnLabel}</th>
                            <th>\u6570\u989d (CNY)</th>
                            <th>\u5360\u6bd4</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="3">\u6682\u65e0\u6570\u636e</td>
                        </tr>
                    </tbody>
                </table>
            `;
            return;
        }

        container.innerHTML = `
            <table class="stat-table">
                <thead>
                    <tr>
                        <th>${firstColumnLabel}</th>
                        <th>\u6570\u989d (CNY)</th>
                        <th>\u5360\u6bd4</th>
                    </tr>
                </thead>
                <tbody>
                    ${stats.map((item) => {
                        const value = Number(item.value || 0);
                        const percentage = total > 0 ? ((value / total) * 100).toFixed(2) : "0.00";
                        return `
                            <tr>
                                <td>${item.label}</td>
                                <td class="is-number">${renderAmount(value)}</td>
                                <td class="is-number">${percentage}%</td>
                            </tr>
                        `;
                    }).join("")}
                </tbody>
            </table>
        `;
    }

    function renderPieChart(canvasId, stats) {
        const labels = stats.map((item) => item.label);
        const values = stats.map((item) => item.value);
        const ctx = document.getElementById(canvasId).getContext("2d");

        new Chart(ctx, {
            type: "pie",
            data: {
                labels,
                datasets: [{
                    data: values,
                    backgroundColor: labels.map((_, index) => chartPalette[index % chartPalette.length]),
                    borderWidth: 2,
                    borderColor: "#ffffff"
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: "bottom",
                        labels: {
                            padding: 18
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label(context) {
                                const label = context.label || "";
                                const value = context.parsed || 0;
                                const total = context.dataset.data.reduce((sum, current) => sum + current, 0);
                                const percentage = total > 0 ? ((value / total) * 100).toFixed(2) : "0.00";
                                return `${label}: ${formatCny(value)} (${percentage}%)`;
                            }
                        }
                    }
                }
            }
        });
    }

    async function fetchAndRenderChart() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();

            totalAmountRawValue = Number(data.total_cny).toFixed(2);
            latestRoleStats = data.stats_by_role || [];
            latestSymbolStats = data.stats_by_symbol || [];
            totalAmountElement.innerText = formatCny(data.total_cny);
            copyButton.disabled = false;

            renderPieChart("rolePieChart", latestRoleStats);
            renderPieChart("symbolPieChart", latestSymbolStats);
            renderStatTable("roleStatsTable", latestRoleStats, "\u89d2\u8272\u540d");
            renderStatTable("symbolStatsTable", latestSymbolStats, "\u5e01\u79cd");
        } catch (error) {
            console.error("Failed to load dashboard data", error);
            totalAmountElement.innerText = "\u6570\u636e\u52a0\u8f7d\u5931\u8d25";
            copyButton.disabled = true;
        }
    }

    function toggleTableAmounts() {
        tableAmountsVisible = !tableAmountsVisible;
        setToggleTableAmountsState();
        renderStatTable("roleStatsTable", latestRoleStats, "\u89d2\u8272\u540d");
        renderStatTable("symbolStatsTable", latestSymbolStats, "\u5e01\u79cd");
    }

    setCopyButtonState("\u590d\u5236\u91d1\u989d", false);
    setToggleTableAmountsState();
    copyButton.addEventListener("click", copyTotalAmount);
    toggleTableAmountsButton.addEventListener("click", toggleTableAmounts);
    window.addEventListener("load", fetchAndRenderChart);
</script>
</body>
</html>
