<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&#x8D44;&#x4EA7;&#x914D;&#x7F6E;&#x770B;&#x677F;</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f5f7fb;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --border: #d0d7de;
            --accent: #0f766e;
            --accent-soft: #ecfeff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .dashboard-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 30px;
            width: 100%;
            max-width: 1480px;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .total-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .total-amount {
            font-size: 2rem;
            font-weight: bold;
            color: var(--text-main);
            margin: 10px 0 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .icon-button {
            border: 1px solid var(--border);
            background: #fff;
            color: #4b5563;
            border-radius: 999px;
            width: 36px;
            height: 36px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .icon-button:hover {
            background: #f3f4f6;
            border-color: #9ca3af;
        }

        .icon-button:active {
            transform: translateY(1px);
        }

        .icon-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .icon-button.copied,
        .icon-button.is-active {
            color: var(--accent);
            border-color: #5eead4;
            background: var(--accent-soft);
        }

        .icon-button svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(320px, 0.72fr);
            gap: 24px;
        }

        .chart-panel {
            border: 1px solid #eef2f7;
            border-radius: 14px;
            padding: 20px;
            background: linear-gradient(180deg, #ffffff 0%, #fafcff 100%);
        }

        .chart-title {
            margin: 0 0 16px;
            font-size: 1rem;
            color: var(--text-main);
            text-align: center;
        }

        .chart-container {
            position: relative;
            margin: 0 auto;
            height: 320px;
            width: min(100%, 360px);
        }

        .chart-table {
            margin-top: 18px;
            overflow-x: auto;
        }

        .qdii-list {
            overflow-x: auto;
            width: 100%;
        }

        .qdii-panel {
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            min-height: 200px;
            border: 1px solid #eef2f7;
            background: linear-gradient(135deg, #ffffff 0%, #fafcff 100%);
        }

        .qdii-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--accent) 0%, #2dd4bf 100%);
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .qdii-panel:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(15, 118, 110, 0.1);
            border-color: rgba(15, 118, 110, 0.2);
            background: linear-gradient(135deg, #ffffff 0%, #f0fdfa 100%);
        }

        .qdii-panel:hover::before {
            opacity: 1;
        }

        .qdii-content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 20px;
            text-align: center;
        }

        .qdii-icon-container {
            margin-bottom: 16px;
            color: var(--accent);
            background: var(--accent-soft);
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .qdii-panel:hover .qdii-icon-container {
            transform: scale(1.1);
        }

        .qdii-title {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .qdii-value {
            font-size: 2.25rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: -0.02em;
            margin: 12px 0 6px;
            background: linear-gradient(135deg, var(--accent) 0%, #0d9488 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .qdii-hint {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-top: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f1f5f9;
            padding: 6px 12px;
            border-radius: 999px;
            transition: all 0.3s ease;
        }

        .qdii-panel:hover .qdii-hint {
            background: var(--accent-soft);
            color: var(--accent);
        }

        .stat-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
            color: var(--text-main);
        }

        .stat-table th,
        .stat-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #eef2f7;
            text-align: left;
            white-space: nowrap;
        }

        .stat-table th {
            color: var(--text-muted);
            font-weight: 600;
            background: #f8fafc;
        }

        .stat-table tbody tr:hover {
            background: #f8fbff;
        }

        .stat-table .is-number {
            text-align: right;
        }

        .amount-hidden {
            color: var(--text-muted);
            letter-spacing: 0.08em;
        }

        @media (max-width: 1200px) {
            .charts-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .qdii-panel {
                grid-column: 1 / -1;
            }
        }

        @media (max-width: 768px) {
            .dashboard-card {
                padding: 24px 18px;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }

            .chart-container {
                height: 280px;
            }
        }

        /* Modal Overlay with Glassmorphism */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* Modal Card Container */
        .modal-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            width: 90%;
            max-width: 680px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            transform: scale(0.95) translateY(10px);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
        }

        .modal-overlay.show .modal-card {
            transform: scale(1) translateY(0);
        }

        /* Modal Header */
        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid #eef2f7;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(180deg, #ffffff 0%, #fafcff 100%);
        }

        .modal-title {
            margin: 0;
            font-size: 1.2rem;
            color: var(--text-main);
            font-weight: 700;
        }

        /* Close Button */
        .close-button {
            border: none;
            background: none;
            color: var(--text-muted);
            font-size: 2rem;
            line-height: 1;
            cursor: pointer;
            padding: 0 4px;
            transition: color 0.2s ease, transform 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }

        .close-button:hover {
            color: var(--text-main);
            background-color: #f3f4f6;
        }

        .close-button:active {
            transform: scale(0.9);
        }

        /* Modal Body */
        .modal-body {
            padding: 24px;
            overflow-y: auto;
            background-color: #ffffff;
        }

        .modal-table-container {
            overflow-x: auto;
            border: 1px solid #eef2f7;
            border-radius: 8px;
        }

        .modal-body .stat-table th {
            position: sticky;
            top: 0;
            z-index: 1;
            background: #f8fafc;
        }

        .modal-body .stat-table td {
            font-size: 0.95rem;
        }

        .modal-body .stat-table tbody tr:last-child td {
            border-bottom: none;
        }
    </style>
</head>
<body>
<div class="dashboard-card">
    <div class="header">
        <div class="total-label">&#x603B;&#x8D44;&#x4EA7; (CNY &#x8BA1;&#x4EF7;)</div>
        <div class="total-amount">
            <span id="totalAmount">CNY 0.00</span>
            <button type="button" class="icon-button" id="copyTotalAmount" aria-label="复制金额" title="复制金额" disabled></button>
            <button type="button" class="icon-button" id="toggleTableAmounts" aria-label="显示金额" title="显示金额"></button>
        </div>
    </div>

    <div class="charts-grid">
        <section class="chart-panel">
            <h2 class="chart-title">&#x6309;&#x89D2;&#x8272;&#x5206;&#x5E03;</h2>
            <div class="chart-container">
                <canvas id="rolePieChart"></canvas>
            </div>
            <div class="chart-table" id="roleStatsTable"></div>
        </section>

        <section class="chart-panel">
            <h2 class="chart-title">&#x6309;&#x5E01;&#x79CD;&#x5206;&#x5E03;</h2>
            <div class="chart-container">
                <canvas id="symbolPieChart"></canvas>
            </div>
            <div class="chart-table" id="symbolStatsTable"></div>
        </section>

        <section class="chart-panel qdii-panel" id="qdiiPanel">
            <div class="qdii-list" id="qdiiList"></div>
        </section>
    </div>
</div>

<!-- Modal for Role Holdings Detail -->
<div id="roleDetailsModal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="modalTitle" class="modal-title">角色的持仓明细</h3>
            <button type="button" id="closeModalBtn" class="close-button" aria-label="关闭" title="关闭">&times;</button>
        </div>
        <div class="modal-body">
            <div class="modal-table-container">
                <table class="stat-table">
                    <thead>
                        <tr>
                            <th>资产名称</th>
                            <th>币种</th>
                            <th class="is-number">持仓数量</th>
                            <th class="is-number">组合占比</th>
                        </tr>
                    </thead>
                    <tbody id="modalTableBody">
                        <!-- Filled by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal for QDII Quota Detail -->
<div id="qdiiDetailsModal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header">
            <h3 class="modal-title">QDII 额度明细</h3>
            <button type="button" id="closeQdiiModalBtn" class="close-button" aria-label="关闭" title="关闭">&times;</button>
        </div>
        <div class="modal-body">
            <div class="modal-table-container">
                <table class="stat-table">
                    <thead>
                        <tr>
                            <th>名称</th>
                            <th class="is-number">额度</th>
                        </tr>
                    </thead>
                    <tbody id="qdiiModalTableBody">
                        <!-- Filled by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = "/api/assets-stats";
    const totalAmountElement = document.getElementById("totalAmount");
    const copyButton = document.getElementById("copyTotalAmount");
    const toggleTableAmountsButton = document.getElementById("toggleTableAmounts");
    const icons = {
        copy: `
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="9" y="9" width="11" height="11" rx="2" stroke-width="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke-width="2" stroke-linecap="round"></path>
            </svg>
        `,
        check: `
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M20 6 9 17l-5-5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
        `,
        eye: `
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" stroke-width="2" stroke-linejoin="round"></path>
                <circle cx="12" cy="12" r="3" stroke-width="2"></circle>
            </svg>
        `,
        eyeOff: `
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m3 3 18 18" stroke-width="2" stroke-linecap="round"></path>
                <path d="M10.6 10.6a3 3 0 0 0 3.8 3.8" stroke-width="2" stroke-linecap="round"></path>
                <path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a16 16 0 0 1-3.1 4.1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M6.6 6.6C3.6 8.6 2 12 2 12s3.5 7 10 7a10.7 10.7 0 0 0 4.4-.9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
        `
    };
    const chartPalette = [
        "#3498db",
        "#2ecc71",
        "#e67e22",
        "#9b59b6",
        "#e74c3c",
        "#16a085",
        "#f1c40f",
        "#34495e",
        "#ff7f50",
        "#8e44ad"
    ];

    let totalAmountRawValue = "0.00";
    let amountsVisible = false;
    let latestRoleStats = [];
    let latestSymbolStats = [];
    let latestQdiiRows = [];
    let latestAssets = [];
    let activeFilterType = null;
    let activeFilterValue = null;

    const roleDetailsModal = document.getElementById("roleDetailsModal");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const modalTitle = document.getElementById("modalTitle");
    const modalTableBody = document.getElementById("modalTableBody");

    const qdiiPanel = document.getElementById("qdiiPanel");
    const qdiiDetailsModal = document.getElementById("qdiiDetailsModal");
    const closeQdiiModalBtn = document.getElementById("closeQdiiModalBtn");
    const qdiiModalTableBody = document.getElementById("qdiiModalTableBody");

    function setCopyButtonState(label, copied) {
        copyButton.innerHTML = copied ? icons.check : icons.copy;
        copyButton.setAttribute("aria-label", label);
        copyButton.setAttribute("title", label);
        copyButton.classList.toggle("copied", Boolean(copied));
    }

    function setToggleTableAmountsState() {
        const label = amountsVisible ? "\u9690\u85cf\u91d1\u989d" : "\u663e\u793a\u91d1\u989d";
        toggleTableAmountsButton.innerHTML = amountsVisible ? icons.eye : icons.eyeOff;
        toggleTableAmountsButton.setAttribute("aria-label", label);
        toggleTableAmountsButton.setAttribute("title", label);
        toggleTableAmountsButton.classList.toggle("is-active", amountsVisible);
    }

    function formatCny(value) {
        return "CNY " + Number(value).toLocaleString("zh-CN", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }

    function openDetailsModal(filterType, filterValue) {
        activeFilterType = filterType;
        activeFilterValue = filterValue;

        const filteredAssets = latestAssets.filter(asset => 
            filterType === "role" ? asset.role === filterValue : asset.symbol === filterValue
        );
        const totalCNY = filteredAssets.reduce((sum, asset) => sum + Number(asset.value_cny || 0), 0);
        const totalPortfolioCNY = Number(totalAmountRawValue) || latestAssets.reduce((sum, asset) => sum + Number(asset.value_cny || 0), 0);
        const percentage = totalPortfolioCNY > 0 ? ((totalCNY / totalPortfolioCNY) * 100).toFixed(2) : "0.00";

        if (filterType === "role") {
            modalTitle.textContent = `角色的持仓明细 - ${filterValue} (占组合 ${percentage}%)`;
        } else {
            modalTitle.textContent = `币种的持仓明细 - ${filterValue} (占组合 ${percentage}%)`;
        }

        renderDetailsTable();
        roleDetailsModal.classList.add("show");
    }

    function closeDetailsModal() {
        roleDetailsModal.classList.remove("show");
        activeFilterType = null;
        activeFilterValue = null;
    }

    function renderDetailsTable() {
        if (!activeFilterType || !activeFilterValue) return;

        const filteredAssets = latestAssets.filter(asset => 
            activeFilterType === "role" ? asset.role === activeFilterValue : asset.symbol === activeFilterValue
        );
        const totalPortfolioCNY = Number(totalAmountRawValue) || latestAssets.reduce((sum, asset) => sum + Number(asset.value_cny || 0), 0);

        const tableHead = document.querySelector("#roleDetailsModal thead tr");
        if (activeFilterType === "role") {
            tableHead.innerHTML = `
                <th>资产名称</th>
                <th>币种</th>
                <th class="is-number">持仓数量</th>
                <th class="is-number">组合占比</th>
            `;
        } else {
            tableHead.innerHTML = `
                <th>资产名称</th>
                <th>角色</th>
                <th class="is-number">持仓数量</th>
                <th class="is-number">组合占比</th>
            `;
        }

        if (!filteredAssets.length) {
            modalTableBody.innerHTML = `
                <tr>
                    <td colspan="4" style="text-align: center; color: var(--text-muted); padding: 20px;">暂无持仓数据</td>
                </tr>
            `;
            return;
        }

        modalTableBody.innerHTML = filteredAssets.map((asset) => {
            const valCny = Number(asset.value_cny || 0);
            const percentage = totalPortfolioCNY > 0 ? ((valCny / totalPortfolioCNY) * 100).toFixed(2) : "0.00";

            const sharesDisplay = amountsVisible
                ? Number(asset.shares).toLocaleString("zh-CN", { minimumFractionDigits: 0, maximumFractionDigits: 6 })
                : `<span class="amount-hidden" aria-label="金额已隐藏">••••••</span>`;

            const col2Display = activeFilterType === "role" ? escapeHtml(asset.symbol) : escapeHtml(asset.role);

            return `
                <tr>
                    <td><strong>${escapeHtml(asset.name || asset.symbol)}</strong></td>
                    <td>${col2Display}</td>
                    <td class="is-number">${sharesDisplay}</td>
                    <td class="is-number">${percentage}%</td>
                </tr>
            `;
        }).join("");
    }

    closeModalBtn.addEventListener("click", closeDetailsModal);

    roleDetailsModal.addEventListener("click", (event) => {
        if (event.target === roleDetailsModal) {
            closeDetailsModal();
        }
    });

    function openQdiiDetailsModal() {
        renderQdiiModalTable();
        qdiiDetailsModal.classList.add("show");
    }

    function closeQdiiDetailsModal() {
        qdiiDetailsModal.classList.remove("show");
    }

    function renderQdiiModalTable() {
        if (!latestQdiiRows.length) {
            qdiiModalTableBody.innerHTML = `
                <tr>
                    <td colspan="2" style="text-align: center; color: var(--text-muted); padding: 20px;">暂无额度数据</td>
                </tr>
            `;
            return;
        }

        qdiiModalTableBody.innerHTML = latestQdiiRows.map((item) => `
            <tr>
                <td><strong>${escapeHtml(item.name)}</strong></td>
                <td class="is-number">${Number(item.quota ?? 0).toLocaleString("zh-CN")}</td>
            </tr>
        `).join("");
    }

    closeQdiiModalBtn.addEventListener("click", closeQdiiDetailsModal);

    qdiiDetailsModal.addEventListener("click", (event) => {
        if (event.target === qdiiDetailsModal) {
            closeQdiiDetailsModal();
        }
    });

    if (qdiiPanel) {
        qdiiPanel.addEventListener("click", openQdiiDetailsModal);
    }

    window.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
            if (roleDetailsModal.classList.contains("show")) {
                closeDetailsModal();
            }
            if (qdiiDetailsModal.classList.contains("show")) {
                closeQdiiDetailsModal();
            }
        }
    });

    async function copyTotalAmount() {
        try {
            await navigator.clipboard.writeText(totalAmountRawValue);
            setCopyButtonState("\u5df2\u590d\u5236", true);
        } catch (error) {
            console.error("Failed to copy total assets", error);
            setCopyButtonState("\u590d\u5236\u5931\u8d25", false);
        }

        window.setTimeout(() => setCopyButtonState("\u590d\u5236\u91d1\u989d", false), 1500);
    }

    function renderAmount(value) {
        if (amountsVisible) {
            return formatCny(value);
        }

        return `<span class="amount-hidden" aria-label="\u91d1\u989d\u5df2\u9690\u85cf">\u2022\u2022\u2022\u2022\u2022\u2022</span>`;
    }

    function renderTotalAmount() {
        totalAmountElement.innerHTML = renderAmount(totalAmountRawValue);
    }

    function renderStatTable(tableId, stats, firstColumnLabel) {
        const container = document.getElementById(tableId);
        const total = stats.reduce((sum, item) => sum + Number(item.value || 0), 0);

        if (!container) {
            return;
        }

        if (!stats.length) {
            container.innerHTML = `
                <table class="stat-table">
                    <thead>
                        <tr>
                            <th>${firstColumnLabel}</th>
                            <th class="is-number">\u6570\u989d (CNY)</th>
                            <th class="is-number">\u5360\u6bd4</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="3">\u6682\u65e0\u6570\u636e</td>
                        </tr>
                    </tbody>
                </table>
            `;
            return;
        }

        container.innerHTML = `
            <table class="stat-table">
                <thead>
                    <tr>
                        <th>${firstColumnLabel}</th>
                        <th class="is-number">\u6570\u989d (CNY)</th>
                        <th class="is-number">\u5360\u6bd4</th>
                    </tr>
                </thead>
                <tbody>
                    ${stats.map((item) => {
                        const value = Number(item.value || 0);
                        const percentage = total > 0 ? ((value / total) * 100).toFixed(2) : "0.00";
                        return `
                            <tr>
                                <td>${item.label}</td>
                                <td class="is-number">${renderAmount(value)}</td>
                                <td class="is-number">${percentage}%</td>
                            </tr>
                        `;
                    }).join("")}
                </tbody>
            </table>
        `;
    }

    function renderQdiiList(rows) {
        const container = document.getElementById("qdiiList");
        if (!container) {
            return;
        }

        const totalQuota = rows.reduce((sum, item) => sum + Number(item.quota || 0), 0);
        const formattedTotalQuota = totalQuota.toLocaleString("zh-CN");

        container.innerHTML = `
            <div class="qdii-content-wrapper">
                <div class="qdii-icon-container">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                    </svg>
                </div>
                <h3 class="qdii-title">QDII 总额度</h3>
                <div class="qdii-value">${formattedTotalQuota}</div>
                <div class="qdii-hint">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        <line x1="11" y1="8" x2="11" y2="14"></line>
                        <line x1="8" y1="11" x2="14" y2="11"></line>
                    </svg>
                    点击查看机构明细
                </div>
            </div>
        `;
    }

    function renderPieChart(canvasId, stats) {
        const labels = stats.map((item) => item.label);
        const values = stats.map((item) => item.value);
        const ctx = document.getElementById(canvasId).getContext("2d");

        new Chart(ctx, {
            type: "pie",
            data: {
                labels,
                datasets: [{
                    data: values,
                    backgroundColor: labels.map((_, index) => chartPalette[index % chartPalette.length]),
                    borderWidth: 2,
                    borderColor: "#ffffff"
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                onClick: (event, activeElements) => {
                    if (activeElements && activeElements.length > 0) {
                        const index = activeElements[0].index;
                        const value = labels[index];
                        if (canvasId === "rolePieChart") {
                            openDetailsModal("role", value);
                        } else if (canvasId === "symbolPieChart") {
                            openDetailsModal("symbol", value);
                        }
                    }
                },
                onHover: (event, activeElements) => {
                    if (canvasId === "rolePieChart" || canvasId === "symbolPieChart") {
                        const target = event.native ? event.native.target : (event.target || ctx.canvas);
                        if (target) {
                            target.style.cursor = (activeElements && activeElements.length > 0) ? "pointer" : "default";
                        }
                    }
                },
                plugins: {
                    legend: {
                        position: "bottom",
                        labels: {
                            padding: 18
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label(context) {
                                const label = context.label || "";
                                const value = context.parsed || 0;
                                const total = context.dataset.data.reduce((sum, current) => sum + current, 0);
                                const percentage = total > 0 ? ((value / total) * 100).toFixed(2) : "0.00";
                                return `${label}: ${formatCny(value)} (${percentage}%)`;
                            }
                        }
                    }
                }
            }
        });
    }

    async function fetchAndRenderChart() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();

            totalAmountRawValue = Number(data.total_cny).toFixed(2);
            latestRoleStats = data.stats_by_role || [];
            latestSymbolStats = data.stats_by_symbol || [];
            latestQdiiRows = data.qdii || [];
            latestAssets = data.assets || [];
            renderTotalAmount();
            copyButton.disabled = false;

            renderPieChart("rolePieChart", latestRoleStats);
            renderPieChart("symbolPieChart", latestSymbolStats);
            renderStatTable("roleStatsTable", latestRoleStats, "\u89d2\u8272\u540d");
            renderStatTable("symbolStatsTable", latestSymbolStats, "\u5e01\u79cd");
            renderQdiiList(latestQdiiRows);
        } catch (error) {
            console.error("Failed to load dashboard data", error);
            totalAmountElement.innerText = "\u6570\u636e\u52a0\u8f7d\u5931\u8d25";
            copyButton.disabled = true;
        }
    }

    function toggleTableAmounts() {
        amountsVisible = !amountsVisible;
        setToggleTableAmountsState();
        renderTotalAmount();
        renderStatTable("roleStatsTable", latestRoleStats, "\u89d2\u8272\u540d");
        renderStatTable("symbolStatsTable", latestSymbolStats, "\u5e01\u79cd");
        if (activeFilterType && activeFilterValue) {
            renderDetailsTable();
        }
    }

    setCopyButtonState("\u590d\u5236\u91d1\u989d", false);
    setToggleTableAmountsState();
    renderTotalAmount();
    copyButton.addEventListener("click", copyTotalAmount);
    toggleTableAmountsButton.addEventListener("click", toggleTableAmounts);
    window.addEventListener("load", fetchAndRenderChart);
</script>
</body>
</html>
