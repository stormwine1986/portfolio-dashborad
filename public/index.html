<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&#x8D44;&#x4EA7;&#x914D;&#x7F6E;&#x770B;&#x677F;</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f5f7fb;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --border: #d0d7de;
            --accent: #0f766e;
            --accent-soft: #ecfeff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .dashboard-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 30px;
            width: 100%;
            max-width: 960px;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .total-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .total-amount {
            font-size: 2rem;
            font-weight: bold;
            color: var(--text-main);
            margin: 10px 0 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .copy-button {
            border: 1px solid var(--border);
            background: #fff;
            color: #4b5563;
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .copy-button:hover {
            background: #f3f4f6;
            border-color: #9ca3af;
        }

        .copy-button:active {
            transform: translateY(1px);
        }

        .copy-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .copy-button.copied {
            color: var(--accent);
            border-color: #5eead4;
            background: var(--accent-soft);
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 24px;
        }

        .chart-panel {
            border: 1px solid #eef2f7;
            border-radius: 14px;
            padding: 20px;
            background: linear-gradient(180deg, #ffffff 0%, #fafcff 100%);
        }

        .chart-title {
            margin: 0 0 16px;
            font-size: 1rem;
            color: var(--text-main);
            text-align: center;
        }

        .chart-container {
            position: relative;
            margin: 0 auto;
            height: 320px;
            width: min(100%, 360px);
        }

        .chart-table {
            margin-top: 18px;
            overflow-x: auto;
        }

        .stat-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
            color: var(--text-main);
        }

        .stat-table th,
        .stat-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #eef2f7;
            text-align: left;
            white-space: nowrap;
        }

        .stat-table th {
            color: var(--text-muted);
            font-weight: 600;
            background: #f8fafc;
        }

        .stat-table tbody tr:hover {
            background: #f8fbff;
        }

        .stat-table td.is-number {
            text-align: right;
        }

        @media (max-width: 768px) {
            .dashboard-card {
                padding: 24px 18px;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }

            .chart-container {
                height: 280px;
            }
        }
    </style>
</head>
<body>
<div class="dashboard-card">
    <div class="header">
        <div class="total-label">&#x603B;&#x8D44;&#x4EA7; (CNY &#x8BA1;&#x4EF7;)</div>
        <div class="total-amount">
            <span id="totalAmount">CNY 0.00</span>
            <button type="button" class="copy-button" id="copyTotalAmount" disabled>&#x590D;&#x5236;&#x91D1;&#x989D;</button>
        </div>
    </div>

    <div class="charts-grid">
        <section class="chart-panel">
            <h2 class="chart-title">&#x6309;&#x89D2;&#x8272;&#x5206;&#x5E03;</h2>
            <div class="chart-container">
                <canvas id="rolePieChart"></canvas>
            </div>
            <div class="chart-table" id="roleStatsTable"></div>
        </section>

        <section class="chart-panel">
            <h2 class="chart-title">&#x6309;&#x5E01;&#x79CD;&#x5206;&#x5E03;</h2>
            <div class="chart-container">
                <canvas id="symbolPieChart"></canvas>
            </div>
            <div class="chart-table" id="symbolStatsTable"></div>
        </section>
    </div>
</div>

<script>
    const API_URL = "/api/assets-stats";
    const totalAmountElement = document.getElementById("totalAmount");
    const copyButton = document.getElementById("copyTotalAmount");
    const chartPalette = [
        "#3498db",
        "#2ecc71",
        "#e67e22",
        "#9b59b6",
        "#e74c3c",
        "#16a085",
        "#f1c40f",
        "#34495e",
        "#ff7f50",
        "#8e44ad"
    ];

    let totalAmountRawValue = "0.00";

    function setCopyButtonState(text, copied) {
        copyButton.innerText = text;
        copyButton.classList.toggle("copied", Boolean(copied));
    }

    function formatCny(value) {
        return "CNY " + Number(value).toLocaleString("zh-CN", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }

    async function copyTotalAmount() {
        try {
            await navigator.clipboard.writeText(totalAmountRawValue);
            setCopyButtonState("\u5df2\u590d\u5236", true);
        } catch (error) {
            console.error("Failed to copy total assets", error);
            setCopyButtonState("\u590d\u5236\u5931\u8d25", false);
        }

        window.setTimeout(() => setCopyButtonState("\u590d\u5236\u91d1\u989d", false), 1500);
    }

    function renderStatTable(tableId, stats, firstColumnLabel) {
        const container = document.getElementById(tableId);
        const total = stats.reduce((sum, item) => sum + Number(item.value || 0), 0);

        if (!container) {
            return;
        }

        if (!stats.length) {
            container.innerHTML = `
                <table class="stat-table">
                    <thead>
                        <tr>
                            <th>${firstColumnLabel}</th>
                            <th>\u6570\u989d (CNY)</th>
                            <th>\u5360\u6bd4</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="3">\u6682\u65e0\u6570\u636e</td>
                        </tr>
                    </tbody>
                </table>
            `;
            return;
        }

        container.innerHTML = `
            <table class="stat-table">
                <thead>
                    <tr>
                        <th>${firstColumnLabel}</th>
                        <th>\u6570\u989d (CNY)</th>
                        <th>\u5360\u6bd4</th>
                    </tr>
                </thead>
                <tbody>
                    ${stats.map((item) => {
                        const value = Number(item.value || 0);
                        const percentage = total > 0 ? ((value / total) * 100).toFixed(2) : "0.00";
                        return `
                            <tr>
                                <td>${item.label}</td>
                                <td class="is-number">${formatCny(value)}</td>
                                <td class="is-number">${percentage}%</td>
                            </tr>
                        `;
                    }).join("")}
                </tbody>
            </table>
        `;
    }

    function renderPieChart(canvasId, stats) {
        const labels = stats.map((item) => item.label);
        const values = stats.map((item) => item.value);
        const ctx = document.getElementById(canvasId).getContext("2d");

        new Chart(ctx, {
            type: "pie",
            data: {
                labels,
                datasets: [{
                    data: values,
                    backgroundColor: labels.map((_, index) => chartPalette[index % chartPalette.length]),
                    borderWidth: 2,
                    borderColor: "#ffffff"
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: "bottom",
                        labels: {
                            padding: 18
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label(context) {
                                const label = context.label || "";
                                const value = context.parsed || 0;
                                const total = context.dataset.data.reduce((sum, current) => sum + current, 0);
                                const percentage = total > 0 ? ((value / total) * 100).toFixed(2) : "0.00";
                                return `${label}: ${formatCny(value)} (${percentage}%)`;
                            }
                        }
                    }
                }
            }
        });
    }

    async function fetchAndRenderChart() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();

            totalAmountRawValue = Number(data.total_cny).toFixed(2);
            totalAmountElement.innerText = formatCny(data.total_cny);
            copyButton.disabled = false;

            renderPieChart("rolePieChart", data.stats_by_role || []);
            renderPieChart("symbolPieChart", data.stats_by_symbol || []);
            renderStatTable("roleStatsTable", data.stats_by_role || [], "\u89d2\u8272\u540d");
            renderStatTable("symbolStatsTable", data.stats_by_symbol || [], "\u5e01\u79cd");
        } catch (error) {
            console.error("Failed to load dashboard data", error);
            totalAmountElement.innerText = "\u6570\u636e\u52a0\u8f7d\u5931\u8d25";
            copyButton.disabled = true;
        }
    }

    copyButton.addEventListener("click", copyTotalAmount);
    window.addEventListener("load", fetchAndRenderChart);
</script>
</body>
</html>
