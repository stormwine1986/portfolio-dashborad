<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资产配置看板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f5f7fb;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --border: #d0d7de;
            --accent: #0f766e;
            --accent-soft: #ecfeff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .dashboard-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 30px;
            width: 100%;
            max-width: 960px;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .total-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .total-amount {
            font-size: 2rem;
            font-weight: bold;
            color: var(--text-main);
            margin: 10px 0 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .copy-button {
            border: 1px solid var(--border);
            background: #fff;
            color: #4b5563;
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .copy-button:hover {
            background: #f3f4f6;
            border-color: #9ca3af;
        }

        .copy-button:active {
            transform: translateY(1px);
        }

        .copy-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .copy-button.copied {
            color: var(--accent);
            border-color: #5eead4;
            background: var(--accent-soft);
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 24px;
        }

        .chart-panel {
            border: 1px solid #eef2f7;
            border-radius: 14px;
            padding: 20px;
            background: linear-gradient(180deg, #ffffff 0%, #fafcff 100%);
        }

        .chart-title {
            margin: 0 0 16px;
            font-size: 1rem;
            color: var(--text-main);
            text-align: center;
        }

        .chart-container {
            position: relative;
            margin: 0 auto;
            height: 320px;
            width: min(100%, 360px);
        }

        @media (max-width: 768px) {
            .dashboard-card {
                padding: 24px 18px;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }

            .chart-container {
                height: 280px;
            }
        }
    </style>
</head>
<body>
<div class="dashboard-card">
    <div class="header">
        <div class="total-label">总资产 (CNY 计价)</div>
        <div class="total-amount">
            <span id="totalAmount">¥ 0.00</span>
            <button type="button" class="copy-button" id="copyTotalAmount" disabled>复制数字</button>
        </div>
    </div>

    <div class="charts-grid">
        <section class="chart-panel">
            <h2 class="chart-title">按角色分布</h2>
            <div class="chart-container">
                <canvas id="rolePieChart"></canvas>
            </div>
        </section>

        <section class="chart-panel">
            <h2 class="chart-title">按 Symbol 分布</h2>
            <div class="chart-container">
                <canvas id="symbolPieChart"></canvas>
            </div>
        </section>
    </div>
</div>

<script>
    const API_URL = "/api/assets-stats";
    const totalAmountElement = document.getElementById("totalAmount");
    const copyButton = document.getElementById("copyTotalAmount");
    const chartPalette = [
        "#3498db",
        "#2ecc71",
        "#e67e22",
        "#9b59b6",
        "#e74c3c",
        "#16a085",
        "#f1c40f",
        "#34495e",
        "#ff7f50",
        "#8e44ad"
    ];

    let totalAmountRawValue = "0.00";

    function setCopyButtonState(text, copied) {
        copyButton.innerText = text;
        copyButton.classList.toggle("copied", Boolean(copied));
    }

    async function copyTotalAmount() {
        try {
            await navigator.clipboard.writeText(totalAmountRawValue);
            setCopyButtonState("已复制", true);
        } catch (error) {
            console.error("复制总资产失败", error);
            setCopyButtonState("复制失败", false);
        }

        window.setTimeout(() => setCopyButtonState("复制数字", false), 1500);
    }

    function renderPieChart(canvasId, stats) {
        const labels = stats.map((item) => item.label);
        const values = stats.map((item) => item.value);
        const ctx = document.getElementById(canvasId).getContext("2d");

        new Chart(ctx, {
            type: "pie",
            data: {
                labels,
                datasets: [{
                    data: values,
                    backgroundColor: labels.map((_, index) => chartPalette[index % chartPalette.length]),
                    borderWidth: 2,
                    borderColor: "#ffffff"
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: "bottom",
                        labels: {
                            padding: 18
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label(context) {
                                const label = context.label || "";
                                const value = context.parsed || 0;
                                const total = context.dataset.data.reduce((sum, current) => sum + current, 0);
                                const percentage = total > 0 ? ((value / total) * 100).toFixed(2) : "0.00";
                                return `${label}: ¥${value.toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} (${percentage}%)`;
                            }
                        }
                    }
                }
            }
        });
    }

    async function fetchAndRenderChart() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();

            totalAmountRawValue = Number(data.total_cny).toFixed(2);
            totalAmountElement.innerText = "¥ " + Number(data.total_cny).toLocaleString("zh-CN", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
            copyButton.disabled = false;

            renderPieChart("rolePieChart", data.stats_by_role || []);
            renderPieChart("symbolPieChart", data.stats_by_symbol || []);
        } catch (error) {
            console.error("加载资产看板数据失败", error);
            totalAmountElement.innerText = "数据加载失败";
            copyButton.disabled = true;
        }
    }

    copyButton.addEventListener("click", copyTotalAmount);
    window.addEventListener("load", fetchAndRenderChart);
</script>
</body>
</html>
