<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资产配置看板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f7fb;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .dashboard-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        .total-amount {
            font-size: 2rem;
            font-weight: bold;
            color: #2c3e50;
            margin: 10px 0 25px 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .copy-button {
            border: 1px solid #d0d7de;
            background: #fff;
            color: #4b5563;
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .copy-button:hover {
            background: #f3f4f6;
            border-color: #9ca3af;
        }
        .copy-button:active {
            transform: translateY(1px);
        }
        .copy-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .copy-button.copied {
            color: #0f766e;
            border-color: #5eead4;
            background: #ecfeff;
        }
        .total-label {
            color: #7f8c8d;
            font-size: 0.9rem;
            text-transform: uppercase;
        }
        .chart-container {
            position: relative;
            margin: auto;
            height: 300px;
            width: 300px;
        }
    </style>
</head>
<body>

<div class="dashboard-card">
    <div class="total-label">总资产 (CNY 计价)</div>
    <div class="total-amount">
        <span id="totalAmount">¥ 0.00</span>
        <button type="button" class="copy-button" id="copyTotalAmount">复制数字</button>
    </div>
    
    <div class="chart-container">
        <canvas id="rolePieChart"></canvas>
    </div>
</div>

<script>
    // 替换为你的 Worker API 真实地址
    const API_URL = '/api/assets-stats'; 
    const totalAmountElement = document.getElementById('totalAmount');
    const copyButton = document.getElementById('copyTotalAmount');
    let totalAmountRawValue = '0.00';

    function setCopyButtonState(text, copied = false) {
        copyButton.innerText = text;
        copyButton.classList.toggle('copied', copied);
    }

    async function copyTotalAmount() {
        try {
            await navigator.clipboard.writeText(totalAmountRawValue);
            setCopyButtonState('已复制', true);
        } catch (error) {
            console.error('复制总资产失败:', error);
            setCopyButtonState('复制失败');
        }

        window.setTimeout(() => setCopyButtonState('复制数字'), 1500);
    }

    async function fetchAndRenderChart() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();

            // 1. 更新总资产文本
            totalAmountRawValue = Number(data.total_cny).toFixed(2);
            totalAmountElement.innerText = '¥ ' + Number(data.total_cny).toLocaleString('zh-CN', { minimumFractionDigits: 2 });
            copyButton.disabled = false;

            // 2. 解析 Chart.js 所需的数据
            const labels = data.stats.map(item => item.role);
            const values = data.stats.map(item => item.value);

            // 3. 渲染饼图
            const ctx = document.getElementById('rolePieChart').getContext('2d');
            new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: [
                            '#3498db', // 安全垫 - 蓝色
                            '#2ecc71', // 流动性 - 绿色
                            '#e67e22', // 生息 - 橙色
                            '#9b59b6', // 养老 - 紫色
                            '#e74c3c'  // 保险 - 红色
                        ],
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { padding: 20 }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.label || '';
                                    let value = context.parsed || 0;
                                    let total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    let percentage = ((value / total) * 100).toFixed(2) + '%';
                                    return `${label}: ¥${value.toLocaleString()} (${percentage})`;
                                }
                            }
                        }
                    }
                }
            });

        } catch (error) {
            console.error("加载资产看板数据失败:", error);
            totalAmountElement.innerText = "数据加载失败";
            copyButton.disabled = true;
        }
    }

    // 页面加载完成后执行
    copyButton.addEventListener('click', copyTotalAmount);
    window.onload = fetchAndRenderChart;
</script>
</body>
</html>
